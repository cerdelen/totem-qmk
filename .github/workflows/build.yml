name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # A real build takes well under a minute. Without a cap, a step that
    # waits on something that never comes ran for GitHub's full 6 hours.
    timeout-minutes: 30

    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: config

      # Vial is a fork of QMK: the vial-qmk tree is what carries VIAL_ENABLE,
      # so the keymap cannot be built against upstream qmk_firmware.
      - name: Check out vial-qmk
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          path: vial-qmk
          submodules: recursive

      # Not the qmk_cli container: it ships Python 3.12, which removed
      # ast.Num, and vial-qmk's helpers still use it -- every build dies with
      # "module 'ast' has no attribute 'Num'". 3.11 is the last one that works.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi \
                                  libnewlib-arm-none-eabi git unzip zip \
                                  python3-pip
          python -m pip install --upgrade pip
          python -m pip install qmk

      - name: Add the Totem keyboard to the tree
        run: cp -r config/totem vial-qmk/keyboards/totem

      - name: Build
        working-directory: vial-qmk
        run: |
          make git-submodule
          # Plain build target. NOT uf2-split-left/right: those are FLASH
          # targets -- after building they sit waiting for an RP2040 to
          # appear over USB, which never happens on a runner, and the job
          # hung until GitHub killed it.
          #
          # One binary serves both halves. Like the stock totem_default,
          # this build has no EE_HANDS, so QMK takes the half with USB as
          # the left one -- the USB cable goes in the left half.
          make totem:vial

      - name: Collect the firmware
        run: |
          mkdir -p firmware
          cp vial-qmk/totem_vial.uf2 firmware/
          ls -la firmware/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/*.uf2

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: config

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      # The stock firmware rides along as a fallback: it is the author's
      # half-duplex build, so it always links these halves, just without Vial.
      - name: Add the stock fallback
        run: cp config/firmware/totem_default.uf2 firmware/

      # One single zip holding every .uf2, never loose assets.
      - name: Package the firmware into a single zip
        run: |
          cd firmware
          zip -j "../Totem-Vial-${GITHUB_REF_NAME}.zip" *.uf2
          cd ..
          unzip -l "Totem-Vial-${GITHUB_REF_NAME}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: Totem-Vial-${{ github.ref_name }}.zip
